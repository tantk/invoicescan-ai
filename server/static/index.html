<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>InvoiceScan AI</title>
    <link rel="stylesheet" href="/css/styles.css?v=108">
</head>
<body>
    <!-- Camera fullscreen (outside app layout, fixed position) -->
    <div id="camera-view" class="camera-view" hidden>
        <video id="camera-preview" autoplay playsinline muted></video>
    </div>

    <div id="app">
        <!-- Header -->
        <header>
            <div class="header-content">
                <div id="header-title" class="header-title">
                    <span class="app-name">InvoiceScan AI</span>
                    <span class="header-total" id="header-total" hidden>
                        <span id="header-amount">0.00</span>
                        <span id="header-currency">USD</span>
                    </span>
                </div>
                <div class="header-right">
                    <a href="/history.html" class="btn-icon" title="Invoice History">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </a>
                    <div id="connection-status" class="status-dot disconnected"></div>
                </div>
            </div>
        </header>

        <!-- Main Area -->
        <main>
            <section class="card main-view">
                <!-- Chat view (always visible) -->
                <div id="chat-view">
                    <!-- Thumbnail queue: pending (left) → processed (right), scrollable -->
                    <div id="thumb-strip" class="thumb-strip" hidden>
                        <div id="thumb-pending" class="thumb-section"></div>
                        <div id="thumb-divider" class="thumb-divider" hidden></div>
                        <div id="thumb-done" class="thumb-section"></div>
                    </div>

                    <!-- Expanded image viewer (pinch-to-zoom) -->
                    <div id="image-viewer" class="image-viewer" hidden>
                        <div id="viewer-zoom" class="viewer-zoom">
                            <img id="viewer-img" alt="">
                        </div>
                        <button id="viewer-close" class="viewer-close">&times;</button>
                    </div>

                    <div id="placeholder" class="upload-area">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                        <p>Tap 🎤 to talk, tap 📷 to snap</p>
                        <p class="hint">Long press 📷 to upload from gallery</p>
                    </div>
                    <input type="file" accept="image/*,.pdf" capture="environment" id="file-input" hidden>

                    <div id="transcript-area">
                        <div class="message system">Scan an invoice to get started.</div>
                    </div>

                </div>
            </section>
        </main>

        <!-- Bottom bar: text input + buttons -->
        <div class="bottom-bar">
            <div class="bottom-input-row">
                <button id="upload-btn" class="btn btn-icon-bar" title="Upload file">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                    </svg>
                </button>
                <input type="text" id="text-input" placeholder="Type a message..." autocomplete="off">
                <button id="send-btn" class="btn btn-send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
            <div class="bottom-buttons-row">
                <button id="mic-btn" class="btn btn-mic" title="Toggle microphone">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                        <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <button id="camera-toggle-btn" class="btn btn-camera-toggle" title="Snap photo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Expanded Total Panel (shown on tap) -->
        <div id="total-panel" class="modal">
            <div class="modal-content card">
                <h3>Session Summary</h3>
                <div class="total-detail">
                    <div class="total-row">
                        <span>Total</span>
                        <span class="total-big" id="panel-total-amount">0.00</span>
                    </div>
                    <div class="total-row">
                        <span>Currency</span>
                        <span id="panel-total-currency">USD</span>
                    </div>
                    <div class="total-row">
                        <span>Invoices</span>
                        <span id="panel-total-count">0</span>
                    </div>
                    <div id="panel-due" class="total-row" hidden>
                        <span>Due</span>
                        <span id="panel-due-text"></span>
                    </div>
                </div>
                <div class="setting-row" style="margin-top:12px;">
                    <label>Display Currency</label>
                    <select id="base-currency">
                        <option value="AUTO">Auto</option>
                        <option value="USD">USD</option><option value="EUR">EUR</option>
                        <option value="GBP">GBP</option><option value="JPY">JPY</option>
                        <option value="INR">INR</option><option value="CNY">CNY</option>
                        <option value="AUD">AUD</option><option value="CAD">CAD</option>
                        <option value="SGD">SGD</option><option value="MYR">MYR</option>
                        <option value="KRW">KRW</option><option value="THB">THB</option>
                        <option value="IDR">IDR</option><option value="HKD">HKD</option>
                        <option value="CHF">CHF</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="currency-save">Save</button>
            </div>
        </div>


    </div>

    <script src="/js/audio.js?v=108"></script>
    <script src="/js/websocket.js?v=108"></script>
    <script src="/js/scanner.js?v=108"></script>
    <script src="/js/app.js?v=108"></script>
</body>
</html>
