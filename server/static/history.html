<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvoiceScan AI — History</title>
    <link rel="stylesheet" href="/css/styles.css?v=5">
    <style>
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .history-header a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .invoice-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            padding: 16px;
        }
        .invoice-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .invoice-card:hover {
            border-color: var(--primary);
        }
        .invoice-card.selected {
            border-color: var(--accent);
        }
        .invoice-card .card-id {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: monospace;
        }
        .invoice-card .card-vendor {
            font-weight: 600;
            margin: 4px 0;
        }
        .invoice-card .card-amount {
            color: var(--accent);
            font-weight: 700;
        }
        .viewer {
            display: flex;
            gap: 16px;
            padding: 16px;
            flex: 1;
        }
        .viewer-image {
            flex: 1;
            position: relative;
        }
        .viewer-image img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: var(--radius-sm);
        }
        .viewer-image canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .viewer-fields {
            width: 300px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .viewer-fields .data-field {
            cursor: pointer;
            transition: background 0.15s, border-left 0.15s;
            border-left: 3px solid transparent;
            padding: 6px 10px;
            margin-bottom: 4px;
            border-radius: 4px;
        }
        .viewer-fields .data-field:hover {
            background: var(--bg-input);
        }
        .viewer-fields .data-field.field-active {
            border-left-color: var(--primary);
            background: rgba(59, 130, 246, 0.08);
        }
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 20px;
        }
        @media (max-width: 768px) {
            .viewer { flex-direction: column; }
            .viewer-fields { width: 100%; max-height: none; }
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div class="history-header">
                <h1>InvoiceScan AI</h1>
                <a href="/">Back to Scanner</a>
            </div>
        </header>

        <main>
            <!-- Invoice list -->
            <div id="invoice-list" class="invoice-list">
                <div class="empty-state">Loading invoices...</div>
            </div>

            <!-- Selected invoice viewer -->
            <div id="viewer" class="viewer" hidden>
                <div style="display:flex; justify-content:flex-end; margin-bottom:8px; width:100%;">
                    <button id="v-close" class="btn btn-small" style="font-size:1.2rem; padding:4px 12px;">&times; Close</button>
                </div>
                <div class="viewer-image">
                    <img id="viewer-img" alt="Invoice">
                    <canvas id="viewer-canvas"></canvas>
                </div>
                <div class="viewer-fields">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <h2 style="font-size:1rem; color:var(--text-muted); margin:0;">Fields</h2>
                        <div style="display:flex; gap:6px;">
                            <button class="btn btn-small" id="v-show-all">Show All</button>
                            <button class="btn btn-small" id="v-hide-all">Hide All</button>
                        </div>
                    </div>
                    <div id="viewer-fields-list"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
    (function() {
        const listEl = document.getElementById("invoice-list");
        const viewer = document.getElementById("viewer");
        const viewerImg = document.getElementById("viewer-img");
        const viewerCanvas = document.getElementById("viewer-canvas");
        const viewerCtx = viewerCanvas.getContext("2d");
        const fieldsList = document.getElementById("viewer-fields-list");

        let allAnnotations = [];
        let activeFields = new Set();

        const COLORS = {
            supplier_name: "#3B82F6", supplier_address: "#3B82F6",
            supplier_tax_id: "#3B82F6", supplier_phone: "#3B82F6",
            receiver_name: "#8B5CF6", receiver_address: "#8B5CF6",
            invoice_id: "#F59E0B", invoice_date: "#F59E0B",
            due_date: "#EF4444", total_amount: "#10B981",
            net_amount: "#10B981", total_tax_amount: "#EF4444",
            currency: "#6B7280", payment_terms: "#6B7280",
        };

        const LABELS = {
            supplier_name: "Vendor", supplier_address: "Vendor Addr",
            supplier_tax_id: "Tax ID", supplier_phone: "Phone",
            supplier_email: "Email", supplier_iban: "IBAN",
            receiver_name: "Bill To", receiver_address: "Bill To Addr",
            receiver_tax_id: "Cust Tax ID",
            invoice_id: "Invoice #", invoice_date: "Date",
            due_date: "Due Date", delivery_date: "Delivery",
            purchase_order: "PO #", payment_terms: "Terms",
            currency: "Currency", net_amount: "Subtotal",
            total_amount: "Total", total_tax_amount: "Tax",
            freight_amount: "Shipping",
        };

        // Load invoice list
        async function loadInvoices() {
            const resp = await fetch("/api/invoices");
            const invoices = await resp.json();
            const ids = Object.keys(invoices);

            if (ids.length === 0) {
                listEl.innerHTML = '<div class="empty-state">No invoices scanned yet. <a href="/">Go scan one.</a></div>';
                return;
            }

            listEl.innerHTML = "";
            for (const id of ids.reverse()) {
                const inv = invoices[id];
                const card = document.createElement("div");
                card.className = "invoice-card";
                card.dataset.id = id;
                card.innerHTML = `
                    <div class="card-id">${id}</div>
                    <div class="card-vendor">${inv.filename || "Unknown"}</div>
                    <div style="font-size:0.8rem; color:var(--text-muted);">${inv.has_data ? "Extracted" : "Pending"}</div>
                `;
                card.addEventListener("click", () => selectInvoice(id));
                listEl.appendChild(card);
            }
        }

        let selectedId = null;

        // Select and display an invoice (tap again to close)
        async function selectInvoice(id) {
            if (selectedId === id) {
                // Tapping same card again — close viewer
                viewer.hidden = true;
                document.querySelector(`[data-id="${id}"]`)?.classList.remove("selected");
                selectedId = null;
                return;
            }
            selectedId = id;

            // Highlight card
            document.querySelectorAll(".invoice-card").forEach(c => c.classList.remove("selected"));
            document.querySelector(`[data-id="${id}"]`)?.classList.add("selected");

            // Load image
            const imgResp = await fetch(`/api/invoices/${id}/image`);
            const imgData = await imgResp.json();
            viewerImg.src = `data:${imgData.mime_type};base64,${imgData.data}`;

            // Load annotations
            const annResp = await fetch(`/api/invoices/${id}/annotations`);
            const annData = await annResp.json();
            allAnnotations = annData.annotations || [];

            viewer.hidden = false;
            activeFields.clear();

            // Build field list
            fieldsList.innerHTML = "";
            for (const ann of allAnnotations) {
                const label = ann.label || LABELS[ann.type] || ann.type.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
                const source = ann.source || "docai";
                const sourceBadge = source.includes("gemini")
                    ? '<span style="font-size:0.6rem;background:rgba(245,158,11,0.15);color:#f59e0b;padding:1px 4px;border-radius:3px;margin-left:4px;">GEMINI</span>'
                    : '<span style="font-size:0.6rem;background:rgba(16,185,129,0.15);color:#10b981;padding:1px 4px;border-radius:3px;margin-left:4px;">DOCAI</span>';

                const field = document.createElement("div");
                field.className = "data-field";
                field.innerHTML = `
                    <span class="label">${label}${sourceBadge}</span>
                    <span class="value" style="font-size:0.85rem;">${ann.value}</span>
                `;
                field.addEventListener("click", () => {
                    if (activeFields.has(ann.type)) {
                        activeFields.delete(ann.type);
                        field.classList.remove("field-active");
                    } else {
                        activeFields.add(ann.type);
                        field.classList.add("field-active");
                    }
                    drawBoxes();
                });
                fieldsList.appendChild(field);
            }

            // Draw all boxes initially
            viewerImg.onload = () => drawBoxes();
        }

        function drawBoxes() {
            const rect = viewerImg.getBoundingClientRect();
            viewerCanvas.width = rect.width;
            viewerCanvas.height = rect.height;
            viewerCanvas.style.width = rect.width + "px";
            viewerCanvas.style.height = rect.height + "px";
            viewerCtx.clearRect(0, 0, viewerCanvas.width, viewerCanvas.height);

            const filtered = activeFields.size > 0
                ? allAnnotations.filter(a => activeFields.has(a.type))
                : allAnnotations;

            for (const ann of filtered) {
                const bbox = ann.bbox;
                if (!bbox || bbox.length < 4) continue;

                const color = COLORS[ann.type] || "#3B82F6";
                const label = ann.label || LABELS[ann.type] || ann.type.replace(/_/g, " ").slice(0, 12);

                const x1 = bbox[0][0] * viewerCanvas.width;
                const y1 = bbox[0][1] * viewerCanvas.height;
                const x2 = bbox[2][0] * viewerCanvas.width;
                const y2 = bbox[2][1] * viewerCanvas.height;

                // Box style based on source
                viewerCtx.lineWidth = 2;
                viewerCtx.strokeStyle = color;
                if (ann.source === "gemini_approx") {
                    viewerCtx.setLineDash([6, 4]);
                } else {
                    viewerCtx.setLineDash([]);
                }
                viewerCtx.strokeRect(x1, y1, x2 - x1, y2 - y1);
                viewerCtx.setLineDash([]);

                // Fill
                viewerCtx.fillStyle = color + "15";
                viewerCtx.fillRect(x1, y1, x2 - x1, y2 - y1);

                // Label
                const fontSize = Math.max(10, Math.min(14, viewerCanvas.width / 60));
                viewerCtx.font = `bold ${fontSize}px sans-serif`;
                const tw = viewerCtx.measureText(label).width;
                const lh = fontSize + 4;
                const ly = y1 - lh > 0 ? y1 - lh : y1;

                viewerCtx.fillStyle = color;
                viewerCtx.fillRect(x1, ly, tw + 8, lh);
                viewerCtx.fillStyle = "#fff";
                viewerCtx.fillText(label, x1 + 4, ly + fontSize);
            }
        }

        // Close viewer
        document.getElementById("v-close").addEventListener("click", () => {
            viewer.hidden = true;
            selectedId = null;
            document.querySelectorAll(".invoice-card").forEach(c => c.classList.remove("selected"));
        });

        // Show All / Hide All
        document.getElementById("v-show-all").addEventListener("click", () => {
            activeFields.clear();
            document.querySelectorAll(".data-field").forEach(f => f.classList.remove("field-active"));
            drawBoxes();
        });

        document.getElementById("v-hide-all").addEventListener("click", () => {
            activeFields.clear();
            document.querySelectorAll(".data-field").forEach(f => f.classList.remove("field-active"));
            viewerCtx.clearRect(0, 0, viewerCanvas.width, viewerCanvas.height);
        });

        window.addEventListener("resize", drawBoxes);
        loadInvoices();
    })();
    </script>
</body>
</html>
